[project]
name = "suzu-vtuber-ai"
version = "0.1.0"
description = "AI-VTuber companion for Arch Linux"
readme = "README.md"
authors = [
    { name = "Scaramouche-gb", email = "zxc.sf2416814@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "imagehash>=4.3.2",
    "litellm>=1.105.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "tomli-w>=1.2.0",
]

[project.scripts]
vtuber-daemon = "daemon.main:main"
vtuberctl = "daemon.ctl:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
