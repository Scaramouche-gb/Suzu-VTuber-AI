[general]
name = "Сузу"
user_name = "Макс"
language = "ru"
log_level = "INFO"

[server]
host = "127.0.0.1"
port = 8765

[llm]
chat_model = "openai/claude-haiku-4-5-20251001"
fast_model = "openai/claude-haiku-4-5-20251001"
fallback_model = "openai/gpt-5.6-luna"
api_base = "https://codex.sale/v1"
temperature = 0.8
max_tokens = 300
max_usd_per_day = 10.0

[stt]
engine = "faster-whisper"
model = "small"
device = "cpu"
compute_type = "int8"
language = "ru"
initial_prompt = "Разговор с подругой по имени Сузу."

[audio_in]
device = ""
sample_rate = 16000
vad_threshold = 0.5
min_speech_ms = 250
end_silence_ms = 700
preroll_ms = 300

[tts]
engine = "silero"
voice = "ru-RU-SvetlanaNeural"
rate = "+5%"
pitch = "+2Hz"
pitch_shift = 1.04

[vision]
enabled = true
output = ""
interval_s = 1.0
scale = 0.4
jpeg_quality = 70
change_threshold = 0.08
send_cooldown_s = 25
max_vlm_calls_per_hour = 60
blacklist_app_ids = ["org.keepassxc.KeePassXC", "bitwarden", "telegram", "org.telegram.desktop"]
blacklist_title_globs = ["*Bank*", "*Банк*", "*пароль*", "*password*"]

[initiative]
enabled = true
mean_interval_s = 40
min_gap_s = 20
quiet_hours = []
backoff_factor = 1.2
max_backoff_s = 150

[memory]
db_path = "~/.local/share/vtuber/memory.db"
context_turns = 12
summarize_every = 20

[avatar]
model = "models/avatar.vrm"
fps = 30
scale = 1.0
y_offset = 0.0
