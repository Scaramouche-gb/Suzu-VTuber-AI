[general]
name = "Сузу"
user_name = "Саша"
language = "ru"
log_level = "INFO"

[server]
host = "127.0.0.1"
port = 8765

[llm]
chat_model = "openai/gpt-5.6-luna"
fast_model = "openai/gpt-5.6-luna"
fallback_model = "openai/gpt-6-sol"
api_base = "https://codex.sale/v1"
temperature = 0.85
max_tokens = 280
max_usd_per_day = 10.0

[stt]
engine = "faster-whisper"
model = "small"
device = "cuda"
compute_type = "float16"
language = "ru"
initial_prompt = "Разговор с подругой по имени Сузу."

[audio_in]
device = ""
sample_rate = 16000
vad_threshold = 0.50
min_speech_ms = 350
end_silence_ms = 700
preroll_ms = 450

[tts]
engine = "xtts"
voice = "ru-RU-SvetlanaNeural"
rate = "+5%"
pitch = "+2Hz"
pitch_shift = 1.04

[tts.xtts]
enabled = true
server_url = "http://127.0.0.1:5055/synthesize"
speaker_wav = "models/xtts/nyamura_speaker.wav"
language = "ru"
speed = 1.0

[tts.rvc]
enabled = false
mode = "sidecar"
server_url = "http://127.0.0.1:5050/infer"
model_path = "models/rvc/nyamura/nyamura-ru.pth"
index_path = "models/rvc/nyamura/nyamura-ru.index"
f0_up_key = 0

[vision]
enabled = true
output = ""
interval_s = 1.0
scale = 0.75
jpeg_quality = 85
change_threshold = 0.08
send_cooldown_s = 25
max_vlm_calls_per_hour = 60
blacklist_app_ids = ["org.keepassxc.KeePassXC", "bitwarden"]
blacklist_title_globs = ["*Bank*", "*Банк*", "*пароль*", "*password*"]

[system_audio]
enabled = true
sample_rate = 16000
vad_threshold = 0.50
min_speech_ms = 350
end_silence_ms = 750


[initiative]
enabled = true
mean_interval_s = 180
min_gap_s = 60
quiet_hours = []
backoff_factor = 1.3
max_backoff_s = 360

[memory]
db_path = "~/.local/share/vtuber/memory.db"
context_turns = 12
summarize_every = 20

[avatar]
model = "models/avatar.vrm"
fps = 30
scale = 1.0
y_offset = 0.0
